services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\IconSelectorBundle\Service\IconListProvider:
    arguments:
      $iconSets: '%nowo_icon_selector.icon_sets%'
      $useIconifyCollection: '%nowo_icon_selector.use_iconify_collection%'
      $collectionLoader: '@?Nowo\IconSelectorBundle\Service\IconifyCollectionLoader'
    public: true

  # Tagged twig.extension by autoconfigure (REQ-SF-003).
  Nowo\IconSelectorBundle\Twig\NowoIconSelectorTwigExtension: ~

  Nowo\IconSelectorBundle\Service\IconSelectorConfigProvider:
    arguments:
      $iconSets: '%nowo_icon_selector.icon_sets%'
      $debug: '%nowo_icon_selector.debug%'
    public: true

  # Invokable API controllers: constructor arguments are autowired (REQ-SF-003); public for the route loader.
  # autoconfigure: false (REQ-SF-004 rule 7) — on Symfony >= 7.3 a #[Route] class is autoconfigured with the
  # routing.controller tag, and the host's `routing.controllers` resource would then expose /api/icon-selector/*
  # without the host importing @NowoIconSelectorBundle/Resources/config/routes.yaml (opt-in only).
  Nowo\IconSelectorBundle\Controller\Api\IconListController:
    autoconfigure: false
    tags: ['controller.service_arguments']
    public: true

  Nowo\IconSelectorBundle\Controller\Api\IconConfigController:
    autoconfigure: false
    tags: ['controller.service_arguments']
    public: true

  Nowo\IconSelectorBundle\Controller\Api\IconSvgController:
    autoconfigure: false
    tags: ['controller.service_arguments']
    public: true

  Nowo\IconSelectorBundle\Service\SvgSanitizer: ~

  # REQ-ARCH-001 rules 1 and 5: the form type and the API controllers read through these ports. A host replaces an
  # alias to serve its own catalogue / config / sanitizer; the class ids above stay valid.
  Nowo\IconSelectorBundle\Service\IconCatalogInterface: '@Nowo\IconSelectorBundle\Service\IconListProvider'
  Nowo\IconSelectorBundle\Service\IconSelectorConfigProviderInterface: '@Nowo\IconSelectorBundle\Service\IconSelectorConfigProvider'
  Nowo\IconSelectorBundle\Service\SvgSanitizerInterface: '@Nowo\IconSelectorBundle\Service\SvgSanitizer'

  Nowo\IconSelectorBundle\Form\IconSelectorType:
    arguments:
      $iconListProvider: '@Nowo\IconSelectorBundle\Service\IconCatalogInterface'
      $iconSets: '%nowo_icon_selector.icon_sets%'
      $iconsApiPath: '%nowo_icon_selector.icons_api_path%'
      $iconRenderer: '@?Symfony\UX\Icons\IconRendererInterface'
      $svgSanitizer: '@Nowo\IconSelectorBundle\Service\SvgSanitizerInterface'
      $debug: '%nowo_icon_selector.debug%'
    # Tagged form.type by autoconfigure (REQ-SF-003).
    public: false
